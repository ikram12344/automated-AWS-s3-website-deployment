name: Deploy website to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::211026994436:role/githubactions3deployrole
          aws-region: ap-south-1

      - name: Upload website to S3
        run: aws s3 cp index.html s3://ikram12344-aws-s3-cicd-2026/index.html --content-type text/html
